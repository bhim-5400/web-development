    <form >
        <h2>Student Registration Form </h2>

        <div class ="radio-group">

        <label > Course </label><br>
        <input type="text">
        <select >
            <option value="select course"></option></Br>
        </select><br>

        <button type="submit">Submit</button>

    </form>



    <form >
        <h2>Job Application Form </h2>

        <label >Full Name </label><br>
        <input type="text"><br>

        <label >Email </label><br>
        <input type="text"><br>

        <label >Phone Number</label><br>
        <input type="text"><br>

        <label >Upload Resume </label><br>
        <input type="file"><br>
        
        <label >Years Of Experience </label><br>
        <input type="number"><br>

        <label >Skills </label><br>
        <input type="checkbox"><br>

        <label >Preferred Job Location </label><br>
        <input type="text">
        <select >
            <option value="Select Location"></option>
        </select><br>

        <label >Cover Letter</label><br>
        <textarea rows="5" id=""></textarea><br>

        <label > Button</label><br>
        <button type="submit">Submit</button>
    </form>


    <form >
        <h2>Online Feedback Form</h2>

        <label >Name</label><br>
        <input type="text"><br>

        <label >Email</label><br>
        <input type="text"><br>

        <label >Rating</label><br>
        <input type="radio"><br>

        <label >Favorite Feature</label><br>
        <input type="text">
        <select >
            <option value="select feature"></option>
        </select><br>

        <label >Suggestions</label><br>
        <textarea rows="8" id=""></textarea><br>

        <label> Would You Recommend us?</label><br>
        <input type="radio">Yes <br>
        <input type="radio">No <br>

        <label >Button</label><br>
        <button type="submit">Submit</button>
    </form >


    <form>
        <h2>Event Registration Form </h2>

        <label >Name</label><br>
        <input type="text"><br>

        <label >Email</label><br>
        <input type="text"><br>

        <label >Phone Number</label><br>
        <input type="text"><br>

        <label >Number Of Participants</label><br>
        <input type="number"><br>

        <label >Meal Preference</label><br>
        <input type="radio">Vegetarian <br>
        <input type="radio">Non-vegetarian <br>

        <label >T-Shirt Size</label><br>
        <input type="text">
        <select name="select size" id=""></select><br>

        <label >Terms And Condition</label><br>
        <input type="checkbox">Allow <br>
        <input type="checkbox">Deny <br>

        <label >Button</label><br>
        <button type="register">Register</button><br>

    </form>



    <form >
        <h2>Hospital Appointment Form</h2>

        <label >Patient Name</label><br>
        <input type="text"><br>

        <label >Age</label><br>
        <input type="text"><br>

        <label >Gender</label><br>
        <input type="radio">Male <br>
        <input type="radio">Female <br>
        <input type="radio">Other <br>

        <label >Contact Number</label><br>
        <input type="text"><br>

        <label >Email</label><br>
        <input type="text"><br>

        <label >Appointment Date</label><br>
        <input type="date"><br>

        <label >Appointment Time</label><br>
        <input type="time"><br>

        <label >Department</label><br>
        <input type="text">
        <select name="select department" id=""></select><br>

        <label>Symptoms</label><br>
        <textarea rows="6" id=""></textarea><br>

        <label >Emergency ?</label><br>
        <input type="checkbox">Yes <br>
        <input type="checkbox">No <br>

        <label >Button</label><br>
        <button type="submit">Book Appointment</button><br>
    </form>
