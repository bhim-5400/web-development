<!DOCTYPE html>
<html>
<head>
    <title>Employee Information Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            text-align: center;
            color: rgb(116, 163, 39);
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse:collapse ;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(255, 25, 113);
        }
    </style>
</head>
<body>

    <table>

            <th>Employee ID</th>
            <th>Name</th>

            <th>Designation</th>

        </tr>
